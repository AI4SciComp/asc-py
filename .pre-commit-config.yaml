repos:
  - repo: local
    hooks:
      - id: asc-py-format-check
        name: asc-py format check
        entry: make format-check
        language: system
        pass_filenames: false
      - id: asc-py-ruff
        name: asc-py Ruff
        entry: make ruff
        language: system
        pass_filenames: false
      - id: asc-py-pylint
        name: asc-py Pylint
        entry: make pylint
        language: system
        pass_filenames: false
      - id: asc-py-typecheck
        name: asc-py strict Pyright
        entry: make typecheck
        language: system
        pass_filenames: false
      - id: asc-py-portable-core-audit
        name: asc-py portable-core audit
        entry: python scripts/audit_portable_core.py
        language: system
        pass_filenames: false
